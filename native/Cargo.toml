# Pliage's native code. pliage-audio = the engine (+ CLI and self-test);
# pliage-audio-node = the Node add-on Pliage's audio process loads.
# pliage-review = opens the Microsoft Store's review window (Store build only).
[workspace]
resolver = "2"
members = ["pliage-audio", "pliage-audio-node", "pliage-review"]

[profile.release]
opt-level = 3
