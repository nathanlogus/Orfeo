    <!-- Cold-start splash: inline so it paints before the bundle parses, and CSS so
         it keeps running on the compositor while that bundle loads. The logo comes
         from the Pliage brand board; Splash.tsx opens it once the app is ready. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 2147483000; overflow: hidden; }
      #splash.is-open { pointer-events: none; }
      .sp-panel { position: absolute; inset: 0; background: #f1e8de; }
      .sp-panel-a { clip-path: polygon(0 0, calc(50% + 50vh + 2px) 0, calc(50% - 50vh + 2px) 100%, 0 100%); }
      .sp-panel-b { clip-path: polygon(calc(50% + 50vh) 0, 100% 0, 100% 100%, calc(50% - 50vh) 100%); }
      .sp-mark { position: absolute; inset: 0; margin: auto; width: min(64vw, 520px); aspect-ratio: 627.62 / 228; }
      .sp-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
      .sp-mark svg:not(.sp-final) { visibility: hidden; }
      #splash.is-open { transition: opacity 200ms ease-out; opacity: 0; }
      @media (prefers-reduced-motion: no-preference) {
        @keyframes sp-pop { from { transform: scale(0); } 70% { transform: scale(1.12); } to { transform: scale(1); } }
        @keyframes sp-merge { to { transform: translate(-16%, 42%) scale(0); } }
        @keyframes sp-rise { from { transform: translateY(70%); opacity: 0; } 40% { opacity: 1; } }
        @keyframes sp-slide { from { transform: translateX(26%); opacity: 0; } 40% { opacity: 1; } }
        @keyframes sp-fold-out { from { transform: rotate(135deg) scaleY(1) rotate(-135deg); } to { transform: rotate(135deg) scaleY(0) rotate(-135deg); } }
        @keyframes sp-fold-in { from { transform: rotate(135deg) scaleY(0) rotate(-135deg); } 75% { transform: rotate(135deg) scaleY(1.1) rotate(-135deg); } to { transform: rotate(135deg) scaleY(1) rotate(-135deg); } }
        @keyframes sp-word { from { transform: translateX(-3%); opacity: 0; } }
        @keyframes sp-show { to { visibility: visible; } }
        @keyframes sp-hide { to { visibility: hidden; } }
        .sp-mark svg:not(.sp-final) { visibility: visible; }
        .sp-mark .sp-final { visibility: hidden; animation: sp-show 1ms linear 760ms forwards; }
        .sp-disc { transform-origin: 35% 35%; animation: sp-pop 200ms ease-out backwards, sp-merge 200ms ease-in 300ms forwards; }
        .sp-tri { transform-origin: 8% 18%; animation: sp-pop 200ms ease-out 50ms backwards, sp-merge 180ms ease-in 320ms forwards; }
        .sp-stem { animation: sp-rise 280ms cubic-bezier(0.2, 1.2, 0.4, 1) 60ms backwards; }
        .sp-head { animation: sp-slide 280ms cubic-bezier(0.2, 1.2, 0.4, 1) 170ms backwards; }
        .sp-corner, .sp-flap { transform-origin: 15.296% 73.684%; }
        .sp-corner { animation: sp-slide 280ms cubic-bezier(0.2, 1.2, 0.4, 1) 170ms backwards, sp-fold-out 120ms ease-in 450ms forwards; }
        .sp-flap { animation: sp-fold-in 190ms ease-out 570ms backwards; }
        .sp-word { animation: sp-word 240ms ease-out 520ms backwards; }
        @keyframes sp-open-a { to { transform: translate(-60vmax, -60vmax); } }
        @keyframes sp-open-b { to { transform: translate(60vmax, 60vmax); } }
        @keyframes sp-mark-out { to { transform: scale(1.06); opacity: 0; } }
        #splash.is-open { transition: none; opacity: 1; }
        #splash.is-open .sp-panel-a { animation: sp-open-a 300ms cubic-bezier(0.5, 0, 0.3, 1) forwards; }
        #splash.is-open .sp-panel-b { animation: sp-open-b 300ms cubic-bezier(0.5, 0, 0.3, 1) forwards; }
        #splash.is-open .sp-mark { animation: sp-mark-out 160ms ease-in forwards; }
      }
    </style>

    <script>
      (function () {
        var el = document.getElementById('splash'), root = document.documentElement, opening = false, gone = false
        root.setAttribute('data-splash', '')
        function leave() {
          if (gone) return
          gone = true
          root.removeAttribute('data-splash')
          el.classList.add('is-open')
          setTimeout(function () { el.remove() }, 320)
        }
        // Loading done: finish the fold at speed and open, never hold the app back
        window.__splashOpen = function (skip) {
          if (opening && !skip) return
          opening = true
          var parts = skip || !el.getAnimations ? [] : el.getAnimations({ subtree: true }).filter(function (a) { return a.playState === 'running' })
          if (!parts.length) return leave()
          parts.forEach(function (a) { a.updatePlaybackRate(4) })
          Promise.all(parts.map(function (a) { return a.finished })).then(leave, leave)
          setTimeout(leave, 260)
        }
        el.addEventListener('pointerdown', function () { window.__splashOpen(true) })
        // A bundle that never loads must not leave the page covered
        setTimeout(window.__splashOpen, 8000)
      })()
    </script>
